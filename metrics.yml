name: Generar métricas de perfil

on:
  schedule:
    # Se ejecuta todos los días a las 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Calendario isométrico de commits (blanco y negro)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics/isocalendar.svg
          committer_branch: main
          committer_message: "actualiza calendario isométrico"
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: America/Bogota
          config_display: large
          config_theme: dark
          config_base_color: "#000000, #ffffff"

      - name: Lenguajes usados recientemente (blanco y negro)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics/languages.svg
          committer_branch: main
          committer_message: "actualiza lenguajes recientes"
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_load: 300
          plugin_languages_recent_days: 14
          plugin_languages_threshold: "0%"
          plugin_languages_limit: 8
          config_timezone: America/Bogota
          config_theme: dark

      - name: Logros de GitHub (blanco y negro)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics/achievements.svg
          committer_branch: main
          committer_message: "actualiza logros"
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
          config_timezone: America/Bogota
          config_theme: dark
